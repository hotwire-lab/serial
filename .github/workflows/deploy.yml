name: Deploy HotWire Serial Terminal PWA to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    uses: hotwire-lab/.github/.github/workflows/pwa-deploy.yml@main
    with:
      app-name: HotWire Serial Terminal